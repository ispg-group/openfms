name: test

on:
  push:
    branches: [ main ]
  pull_request:

env:
  FORCE_COLOR: 1

jobs:

  build:
    name: ${{ matrix.toolchain.compiler }}-${{ matrix.toolchain.version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Only collect test coverage with gfortran
      FFLAGS: ${{ matrix.toolchain.compiler == 'gcc' && '--coverage -fprofile-abs-path' || '' }}
      LDFLAGS: ${{ matrix.toolchain.compiler == 'gcc' && '--coverage' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        toolchain:
          - {compiler: gcc, version: latest}
          - {compiler: intel, version: latest}
          - {compiler: nvidia-hpc, version: '26.5'}
          - {compiler: aocc, version: '5.1.0'}
        include:
          - os: ubuntu-22.04
            toolchain: {compiler: intel-classic, version: '2021.10'}
          - os: macos-26
            toolchain: {compiler: gcc, version: '15'}
          - os: ubuntu-22.04
            toolchain: {compiler: gcc, version: '9'}

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 2

    - uses: fortran-lang/setup-fortran@v1
      id: setup-fortran
      with:
        compiler: ${{ matrix.toolchain.compiler }}
        version: ${{ matrix.toolchain.version }}

      # Python is needed for tests
    - uses: actions/setup-python@v6
      with:
        python-version: 3.13

    - name: Configure
      run: ./configure.sh
      env:
        # -fcheck=all messes up code coverage. It is only enabled in debug build below
        FFLAGS: ${{ matrix.toolchain.compiler == 'gcc' && '--check=no-bounds' || '' }}
    - name: Build
      run: make -j

    - name: Unit tests
      # nvfortran sometimes fails with "Illegal instruction (core dumped)"
      if: matrix.toolchain.compiler != 'nvidia-hpc'
      run: make unittest

    - name: End-to-end tests
      run: make test

    - name: Codecov upload
      uses: codecov/codecov-action@v5
      # For some reason gcov does not seem to work on MacOS
      if: startsWith(matrix.os, 'ubuntu') && matrix.toolchain.compiler == 'gcc'
      with:
        name: GCC-${{ matrix.gcc_v}} (${{ matrix.os }})
        slug: ispg-group/openfms
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true


  # Run tests with leak, address and undefined behaviour sanitizers (ASan, UBSan et al)
  debug_build:
    name: Debug build (GCC-${{ matrix.gcc_v}}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      FFLAGS: -fsanitize=address,undefined,leak --check=all
      LDFLAGS: -fsanitize=address,undefined,leak
    strategy:
      fail-fast: false
      matrix:
         gcc_v: [15]
         os: [ubuntu-24.04]

    steps:
    - uses: actions/checkout@v6

    - uses: fortran-lang/setup-fortran@v1
      id: setup-fortran
      with:
        compiler: gcc
        version: ${{ matrix.gcc_v }}

    - name: Configure
      run: ./configure.sh

    - name: Build
      run: make -j

      # We don't run unit tests, they make sanitizer unhappy
    - name: End-to-end tests
      run: make test


  cmake_build:
    name: CMake ${{ matrix.toolchain.compiler }}-${{ matrix.toolchain.version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - {compiler: gcc, version: latest}
          - {compiler: intel, version: latest}

    steps:
    - uses: actions/checkout@v6

    - uses: fortran-lang/setup-fortran@v1
      id: setup-fortran
      with:
        compiler: ${{ matrix.toolchain.compiler }}
        version: ${{ matrix.toolchain.version }}

    - name: Configure
      run: >
        cmake -S . -B build-cmake
        -DOPENFMS_BACKEND=zero
        -DCMAKE_BUILD_TYPE=Debug
        -DBUILD_TESTING=ON

    - name: Build
      run: cmake --build build-cmake --parallel

    - name: Test
      run: ctest --test-dir build-cmake --output-on-failure

  tc_build:
    name: TC build (${{ matrix.mpi }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
         mpi: [intelmpi, mpich]
    steps:
    - uses: actions/checkout@v6

    - name: Setup MPI
      if: matrix.mpi != 'mpich'
      uses: mpi4py/setup-mpi@v1
      with:
        mpi: ${{ matrix.mpi }}

    - name: MPICH build Cache
      if: matrix.mpi == 'mpich'
      id: mpich-cache
      uses: actions/cache@v4
      with:
        path: ~/mpich/
        key: ${{runner.os}}-ubuntu22.04-mpich-gfortran-${{hashFiles('.github/install_mpich.sh')}}

    - name: Build and Install MPICH
      if: matrix.mpi == 'mpich' && steps.mpich-cache.outputs.cache-hit != 'true'
      # Without the extra "-fallow-argument-mismatch" FFLAG, configure with GFortran >=10 fails with:
      # "The Fortran compiler gfortran does not accept programs
      # that call the same routine with arguments of different types"
      env:
        FFLAGS: -fallow-argument-mismatch -O1
        FCFLAGS: -fallow-argument-mismatch -O1
      run: |
        .github/install_mpich.sh ${HOME}/mpich 4.0.2

    - name: Configure with TC interface
      env:
        FC: ${{ matrix.mpi == 'mpich' && '${HOME}/mpich/4.0.2/install/bin/mpifort' || 'mpif90' }}
      run: ./configure.sh tc

    - name: Build
      run: make -j

    - name: Unit tests
      run: make unittest

    - name: End-to-end tests
      run: make test
