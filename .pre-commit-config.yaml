# See https://prek.j178.dev for more information
repos:
  # https://prek.j178.dev/builtin/
  - repo: builtin
    hooks:
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-executables-have-shebangs

  # Run fortitude linter, https://fortitude.readthedocs.io/
  - repo: https://github.com/PlasmaFAIR/fortitude-pre-commit
    rev: v0.7.5
    hooks:
      - id: fortitude

  - repo: local
    hooks:
      - id: module-usage
        name: Check module usage
        language: system
        entry: grep -Ein 'use (trajectory|particle|bundle)Module.*only'
        files: '.[fF]90$'
        pass_filenames: true

      # fprettify autoformatter
      - id: format
        name: Autoformat code
        language: system
        entry: ./autoformat.py
        files: 'src/.*[fF]90$'
        pass_filenames: true
