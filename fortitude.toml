[check]
ignore = [
  "implicit-external-procedures", # requires Fortran 2018
  "star-kind", # don't use integer*4 et al
  "literal-kind",
  "unchecked-stat",  # TODO: Fix this!
  "nonportable-shortcircuit-inquiry",  # TODO: Fix this!
]
line-length = 132
show-fixes = true
extend-exclude = ["unit_tests/testdrive.F90"]

[check.strings]
quotes = 'single'

# In general, we enforce the "use SomeModule, only: xxx, yyy" pattern,
# to make it explicit which subroutine/variable come from a given module.
# The below modules are exceptions, either for convenience (GlobalModule)
# or necessity (Particle|Trajectory|Bundle modules, see check_module_usage.sh for explanation).
[check.use-statements]
allow-bare-use = [
  "GlobalModule",
  "FMSModule",
  "ElecStrucModule",
  "MinSearchModule",
  "QM_MM_Module",
  "SamplingModule",
  "ParticleModule",
  "TrajectoryModule",
  "BundleModule",
]

[check.per-file-ignores]
# TODO: Add missing intents!
"src/modules/{Trajectory,Thermo,Terachem,Template,SMD,Bundle,Rattle,MinSearch,Restart,Spawn,Overlap}*.[fF]90" = ["missing-intent"]
"src/read_namelist.f90" = ["use-all"]
# TODO: Resolve this!
"src/modules/SpawnModule.f90" = ["missing-exit-or-cycle-label"]
# TODO: Would be nice to resolve this
"src/modules/RattleModule.f90" = ["initialisation-in-declaration"]
"src/*.[fF]90" = ["procedure-not-in-module"]
"src/modules/TerachemModule.F90" = ["assumed-size"]
"src/modules/BundleCalcsModule.f90" = ["common-block"]
"src/modules/MinSearchModule.f90" = ["interface-implicit-typing"]
# fortitude confused by ifdef?
"src/modules/QuanticsModule.F90" = ["implicit-typing", "missing-accessibility-statement"]
"src/modules/{Overlap,Verlet}Module.f90" = ["trailing-backslash"]
