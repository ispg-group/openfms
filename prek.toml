# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
  { id = "no-commit-to-branch" },
  { id = "check-yaml" },
  { id = "check-added-large-files" },
  { id = "check-merge-conflict" },
  { id = "check-executables-have-shebangs" }
]

[[repos]]
# fortitude: A Fortran linter, https://fortitude.readthedocs.io/
repo = "https://github.com/PlasmaFAIR/fortitude-pre-commit"
rev = "v0.9.0"
hooks = [
  {
    id = "fortitude",
    args = ["--fix"]
  }
]

[[repos]]
# shellcheck: A shell linter, https://www.shellcheck.net/
repo = "https://github.com/koalaman/shellcheck-precommit"
rev = "v0.11.0"
hooks = [
  {
    id = "shellcheck",
    files = "run_fms_tc.sh"
  }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "module-usage",
    name = "Check module usage",
    language = "system",
    entry = "./check_module_usage.sh",
    files = ".[fF]90$",
    pass_filenames = true
  },
  {
    id = "format",
    name = "Format Fortran code",
    language = "python",
    entry = "./autoformat.py",
    files = ".[fF]90$",
    pass_filenames = true,
    exclude = "unit_tests/testdrive.F90"
  }
]
